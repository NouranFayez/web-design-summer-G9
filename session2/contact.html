<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- action ==> search -->
    <form autocomplete="off" method="post">
        <h2>Registration Form</h2>
        <!-- block element -->
        <div>
            <label >First Name : </label>
            <input type="text" autocomplete="off"  name="firstName" required placeholder="Enter your first name">
        </div>
        <div>
            <label >Last Name :</label>
            <input type="text" id="lastName" autocomplete="off"   autofocus name="lastName">
        </div>

        <label for="userEmail">email</label>
        <input type="email" id="userEmail" name="userEmail">
        <br>
        <!-- nouran123@hotmail.com -->

        <div>
            <label>password</label>
            <input type="password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                title="Must contain at least one  number and one uppercase and lowercase letter, and at least 8 or more characters"
                name="userPassword">
        </div>

        <div>
            <label>Shipping Area</label>
            <input type="text" value="Alex" name="shippingArea" disabled>
            <input type="text" value="Alex" name="shippingArea" readonly>
        </div>

        <div>
            <label>Age</label>
            <input type="number" name="Age" min="10" max="20">
        </div>
        <!-- firstName=Nouran&lastName=Fayez&userEmail=nouran_ahmed269%40hotmail.com&userPassword=123&shippingArea=Alex -->
        <!-- ?firstName=asdfghj&lastName=sdfgh&userEmail=sdfgh%40sdfghj&userPassword= -->
        <!-- firstName=&lastName=&userEmail=&userPassword=&shippingArea=Alex -->

        <div>
            <label>Gender : </label>
            <input type="radio" name="gender" value="male"><label>Male</label>
            <input type="radio" name="gender" value="female"><label>Female</label>
        </div>
        <div>
            <label>Track</label>
            <input type="checkbox" name="track" value="0"><label>Frontend</label>
            <input type="checkbox" name="track" value="1"><label>backed</label>
            <input type="checkbox" name="track" value="2"><label>Network</label>
        </div>
        <div>
            <!-- <label for="">Course</label> -->
            <select name="course" id="">
                <option value="">choose a course</option>
                <option value="1">Html</option>
                <option value="2" selected>cascading style sheet (recommended)</option>
                <option value="3">Js</option>
            </select>
            <!-- &course=css -->
            <!-- &course=cascading+style+sheet -->
            <!-- &course=2 -->
            <!-- &course=choose+a+course -->
            <!-- &course= -->

             <select name="courseTest" multiple id="">
                <option value="">choose a course</option>
                <option value="1">Html</option>
                <option value="2" selected>cascading style sheet (recommended)</option>
                <option value="3">Js</option>
            </select>
        </div>
        <!-- accept ==> search -->
        <input type="file" multiple name="">
        <input type="date" name="">
        <input type="datetime-local" name="">
        <input type="month" name="">
        <input type="time" name="">
        <input type="color" name="">
        <br>
        <!-- step ==> search -->
        <input type="range" name="range" min="200" max="500" value="200">
        <div>
            <label for="">ID card</label>
            <input type="text" maxlength="10" minlength="3">
        </div>
        <div>
            <label for="">Message</label>
            <textarea name="" id="" placeholder="enter your message" rows="6" cols="100"></textarea>
        </div>
        <div>
            <input type="submit" value="Register">
            <input type="reset" value="Clear Data">

        </div>





    </form>



    
</body>

</html>
